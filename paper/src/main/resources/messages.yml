# ============================================================================
#  MikuAuth-Paper 语言文件（支持 MiniMessage 与 & 颜色代码）
# ============================================================================
prefix: "<gradient:#00e0ff:#a855f7>MikuAuth</gradient> <dark_gray>»</dark_gray> "

# ----------------------------------------------------------------------------
# 进服前对话框（原始 Dialog，客户端 1.21.6+ 起支持）
# ----------------------------------------------------------------------------
dialog:
  login:
    title: "<gradient:#ffd700:#ff8800>登录验证</gradient>"
    body: "<gray>欢迎回来，</gray><yellow>{player}</yellow><gray>！</gray>\n<yellow>剩余认证时间：{seconds} 秒</yellow>"
    input-label: "<yellow>游戏密码</yellow>"
    button: "<green>确认登录</green>"
    button-tooltip: "<gray>点击提交密码</gray>"
  register:
    title: "<gradient:#00e0ff:#a855f7>账号注册</gradient>"
    body: "<gray>首次进入，</gray><yellow>{player}</yellow><gray>！</gray>\n<yellow>剩余认证时间：{seconds} 秒</yellow>"
    input-label: "<yellow>设置密码</yellow>"
    confirm-label: "<yellow>确认密码</yellow>"
    button: "<green>完成注册</green>"
    button-tooltip: "<gray>点击提交注册信息</gray>"

# ----------------------------------------------------------------------------
# 认证结果
# ----------------------------------------------------------------------------
auth:
  success:
    login:
      title: "<green>✔ 登录成功</green>"
      subtitle: "<gray>欢迎回来，</gray><yellow>{player}</yellow>"
      chat: "<green>登录成功，祝您游戏愉快！"
    register:
      title: "<green>✔ 注册成功</green>"
      subtitle: "<gray>欢迎加入，</gray><yellow>{player}</yellow>"
      chat: "<green>注册成功！下次进入请使用相同密码登录。"

# ----------------------------------------------------------------------------
# 错误提示（会追加进对话框正文，并在断开时使用）
# ----------------------------------------------------------------------------
error:
  password-empty: "<red>请输入密码。"
  password-length: "<red>密码长度需在 {min} ~ {max} 个字符之间。"
  password-too-long: "<red>密码过长（上限 {bytes} 字节），请缩短或减少汉字等非 ASCII 字符。"
  password-invalid-chars: "<red>密码不能包含空格、制表符等空白字符。"
  password-mismatch: "<red>两次输入的密码不一致，请重新输入。"
  password-wrong: "<red>密码错误，请重新输入。"
  password-same: "<red>新密码不能与当前密码相同。"
  old-password-wrong: "<red>当前密码错误。"
  not-registered: "<red>你的账号尚未注册。"
  already-registered: "<red>该昵称已被注册。"
  ip-limit: "<red>你的 IP 注册的账号数量已达上限。"
  locked: "<red>登录失败次数过多，请 {minutes} 分钟后再试。"
  server-busy: "<red>服务器繁忙或出现内部错误，请稍后重试。"
  must-authenticate: "<red>请先完成登录或注册。"
  players-only: "<red>该命令仅玩家可用。"
  no-dialog-client: "<red>你的客户端不支持进服前对话框（需要 1.21.6+），请联系管理员。"

kick:
  # 配置阶段既没有聊天栏也没有命令，超时/不支持对话框的玩家只能从断开画面得到提示，
  # 因此这里要把"客户端版本"这条常见原因直接写出来
  timeout: "<red>登录验证超时，请重新连接后再试。\n<gray>若你连续看到本提示，可能是客户端低于 1.21.6（不显示登录对话框），请联系管理员。"
  too-many-tries: "<red>密码错误次数过多。"
  locked: "<red>登录失败次数过多，请 {minutes} 分钟后再试。"
  internal-error: "<red>认证服务暂时不可用，请稍后重试。"
  no-dialog-client: "<red>该客户端不支持进服前登录对话框（需要 Minecraft 1.21.6+）。"

# ----------------------------------------------------------------------------
# 管理命令
# ----------------------------------------------------------------------------
admin:
  error: "<red>操作失败：{reason}"
  reload: "<green>配置与语言文件已重载。"
  usage: "<red>用法：{usage}"
  # {subject} = 玩家名或 IP
  unlock-success: "<green>已解除 {subject} 的登录失败封禁。"
  unlock-none: "<gray>{subject} 当前没有封禁记录（参数填玩家名或 IP）。"
  # {player} = 查询昵称，{count} = 该 IP 名下账号数
  # 统计口径是"该账号最近登录 IP 下的账号数"，不是该玩家名下的账号数
  accounts-header: "<gray>玩家</gray> <yellow>{player}</yellow> <gray>最近登录 IP 名下共有 {count} 个账号。</gray>"
  accounts-none: "<red>未找到玩家 {player} 的账号记录。"
  audit-header: "<gray>玩家</gray> <yellow>{player}</yellow> <gray>最近 {count} 条审计：</gray>"
  audit-none: "<gray>没有查到 <yellow>{player}</yellow> 的审计记录。</gray>"
