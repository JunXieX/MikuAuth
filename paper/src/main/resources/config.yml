# ============================================================================
#  MikuAuth-Paper 配置文件
#
#  本版本只提供「进服前登录」一种模式：玩家停在服务端的配置阶段
#  （画面是"加载地形"、尚未进入世界），由原生对话框完成注册/登录，
#  通过后连接才继续、玩家才真正进入世界。
#
#  与代理端（Velocity 版）的关系：两者可以共用同一个账号库（表结构一致），
#  但不能同时接管登录 —— 同一台服上只留一个登录插件。
# ============================================================================

# ----------------------------------------------------------------------------
# 数据库
#   sqlite：单文件，位于 plugins/MikuAuth/auth.db，开箱即用
#   表名固定 miku_players / miku_sessions / miku_audit_log，
#   与代理端一致，可直接共用同一个库（切换前请先停服备份）
# ----------------------------------------------------------------------------
database:
  # 数据库类型：sqlite（单文件，默认）/ mariadb / mysql（多服共用账号库）
  # ⚠ 切换类型不会搬运已有账号，需要自行导出/导入 miku_players 与 miku_audit_log
  type: sqlite
  # SQLite 文件名（位于 plugins/MikuAuth 下）
  file: "auth.db"

  # 网络数据库连接参数（type = mariadb / mysql 时生效）
  mariadb:
    host: "127.0.0.1"
    port: 3306
    database: "mikuauth"
    username: "mikuauth"
    password: ""

# ----------------------------------------------------------------------------
# 注册
# ----------------------------------------------------------------------------
registration:
  # 密码最小长度（字符）
  min-password-length: 4
  # 密码最大长度（字符）；BCrypt 硬上限是 72 字节，超长会在入口处拦下。
  # 对话框里的输入框会按这个值放开输入上限（Paper 默认只允许 32 个字符），
  # 因此改大之后老玩家用长密码也能正常登录。
  max-password-length: 32
  # 每个 IP 最多注册几个账号；0 = 不限制
  max-accounts-per-ip: 5

# ----------------------------------------------------------------------------
# 登录
# ----------------------------------------------------------------------------
login:
  # 单次连接内允许的密码尝试次数，超过后断开
  max-tries: 5
  # 配置阶段等待认证的上限（秒）；超时断开。
  # ⚠ 此值应小于服务端自身的配置阶段超时，否则玩家看到的是服务端的超时断开。
  timeout-seconds: 60
  # BCrypt 成本（8 ~ 16）
  bcrypt-cost: 10

# ----------------------------------------------------------------------------
# 防暴破（跨连接失败计数）
#   max-failures 次失败后临时封禁 lockout-minutes 分钟
# ----------------------------------------------------------------------------
security:
  max-failures: 5
  failure-window-minutes: 15
  lockout-minutes: 5

# ----------------------------------------------------------------------------
# 对话框
# ----------------------------------------------------------------------------
dialog:
  # 是否允许 Esc 关闭对话框。false 时玩家只能提交或等超时。
  # 允许按 Esc 关闭后，玩家依然停在"加载地形"画面，必须等超时才会被断开，
  # 所以默认关闭。
  allow-close-with-escape: false

# ----------------------------------------------------------------------------
# 审计
# ----------------------------------------------------------------------------
audit:
  enabled: true
  retain-days: 30

