name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      modrinth_check:
        description: "只在 Modrinth 做一次只读校验（检查令牌/项目可达性，不上传任何东西）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # verify 会连带执行测试（surefire），比 package 更能挡住“编译过但测试挂”的提交。
      # MariaDbBackendTest 在未提供 -Dmikuauth.test.mariadb.host 时会自动跳过。
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Show artifacts
        run: ls -lh target/*.jar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MikuAuth
          # 不用 target/*.jar：shade 会把替换前的原始 jar 留成 original-MikuAuth-<版本>.jar，
          # 用通配会把它一起传上去，用户可能误取到未打包依赖的那个
          path: target/MikuAuth-*.jar
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/MikuAuth-*.jar
          prerelease: ${{ contains(github.ref_name, 'Beta') }}
          # 更新日志以仓库内的 RELEASE_NOTES.md 为准（发布前更新该文件）。
          # 此前用 generate_release_notes 由 GitHub 自动生成，而下面的 Modrinth
          # 上传步骤读的就是 Release 正文，于是 Modrinth 只能拿到一行 "Full Changelog" 链接。
          body_path: RELEASE_NOTES.md

      # ------------------------------------------------------------------
      # README → Modrinth 项目页：**面向用户的文档只维护 README.md 一份**，
      # 这里把它的原文同步成 Modrinth 的 body，并把开头两句（英文段+中文段）拼成摘要。
      # 只在 main 与 tag 上跑（不从特性分支把未定稿的文档推上去），PR 跳过。
      # 审核期间 Modrinth 会锁编辑，此时只打印警告、不让构建变红。
      # ------------------------------------------------------------------
      - name: Sync README to Modrinth
        if: >-
          github.event_name != 'pull_request'
          && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT: VKY1fqvo
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request

          try:
              sys.stdout.reconfigure(encoding='utf-8')
          except Exception:
              pass

          token = (os.environ.get('MODRINTH_TOKEN') or '').strip()
          if not token:
              print('未配置 MODRINTH_TOKEN，跳过同步。')
              sys.exit(0)

          PROJECT = os.environ['PROJECT']
          API = 'https://api.modrinth.com/v2'
          with open('README.md', encoding='utf-8') as f:
              body = f.read().rstrip() + '\n'

          # 摘要 = README 第一个二级标题之前的第一段**纯英文**。
          # 注意：Modrinth 对项目描述有 required 级校验 project_description_non_english——
          # 中英混排一样会被判为非英文（实测 "英文 ｜ 中文" 被 400 拒绝），因此摘要只能是英文段。
          # README 正文（body）不受该限制，中文内容照常同步到项目页。
          head = body.split('\n## ', 1)[0]
          paras = []
          for raw in re.split(r'\n\s*\n', head):
              p = ' '.join(l.strip() for l in raw.strip().splitlines() if l.strip())
              if p and not p.startswith(('#', '- ', '*')):
                  paras.append(p)
          cjk = re.compile(r'[\u4e00-\u9fff]')
          en = next((p for p in paras if not cjk.search(p)), '')
          # 没有英文段就跳过：绝不把中文描述写到项目页（Modrinth 会拒绝，且描述项是必填英文）
          if not en:
              print('[skip] README 开头没有英文段落，本次不同步（Modrinth 要求项目描述为英文）。')
              sys.exit(0)
          desc = en
          if len(desc) > 256:
              print('警告：摘要 %d 字符超限，已截断（请把 README 开头的英文段写短）' % len(desc))
              desc = desc[:255] + '…'

          def call(method, path, data=None, ctype=None):
              req = urllib.request.Request(API + path, data=data, method=method)
              req.add_header('User-Agent', 'MikuMC-Plugin-Dev/1.0')
              req.add_header('Authorization', token)
              if ctype:
                  req.add_header('Content-Type', ctype)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      raw = r.read().decode('utf-8')
                      return r.status, (json.loads(raw) if raw.strip() else {})
              except urllib.error.HTTPError as e:
                  return e.code, {'error': e.read().decode('utf-8', 'replace')[:400]}

          st, p = call('GET', '/project/%s' % PROJECT)
          if st != 200:
              print('读取项目失败:', st, p)
              sys.exit(1)
          if (p.get('body') or '').rstrip() == body.rstrip() and p.get('description') == desc:
              print('[skip] Modrinth 上的正文与摘要已与 README 一致，无需更新')
              sys.exit(0)

          data = json.dumps({'description': desc, 'body': body}, ensure_ascii=False).encode()
          st, resp = call('PATCH', '/project/%s' % PROJECT, data, 'application/json')
          if st in (200, 204):
              print('已同步 README → Modrinth（body %d 字符，摘要 %d 字符）' % (len(body), len(desc)))
              sys.exit(0)
          if st == 400 and 'nags' in str(resp):
              # 项目校验未通过（Modrinth 的措辞是 "resolve required project validation messages"
              # + nags 列表，severity 分 suggestion / required）：
              #   - status=processing（项目正在审核）：Modrinth 锁住编辑，此时改不了 ——
              #     只告警、不让构建变红，审核结束后重跑本步骤即可（原设计意图，此处修正判定措辞）；
              #   - 其余情形若含 required 级 nag：属必须人工处理的问题，报错并让构建变红，
              #     避免像以前那样被静默吞掉。
              print('项目校验未通过（status=%s）: %s' % (p.get('status'), resp.get('error')))
              if p.get('status') == 'processing':
                  print('项目正在审核中，Modrinth 暂锁编辑；审核结束后重跑本步骤即可同步。')
                  sys.exit(0)
              if 'resolve required' in str(resp):
                  print('存在 required 级校验项（见上方 nags 中 severity=required 的项），'
                        '请先在 Modrinth 项目页处理，再重跑本步骤。')
                  sys.exit(1)
              print('仅有建议级校验项，本次不改动项目页。')
              sys.exit(0)
          print('同步失败:', st, resp)
          sys.exit(1)
          PY

      # ------------------------------------------------------------------
      # Modrinth：只有「正式版」（tag 不含 Beta）才上传；测试版完全跳过。
      # 幂等：该版本号已存在时直接跳过，重复跑工作流不会产生重复版本。
      # 想先验证令牌/项目是否可达，可在 Actions 页面手动触发并勾选 modrinth_check。
      # ------------------------------------------------------------------
      - name: Publish to Modrinth
        if: >-
          (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'Beta'))
          || inputs.modrinth_check
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          MODRINTH_CHECK_ONLY: ${{ inputs.modrinth_check }}
          # 支持的游戏版本（与 Modrinth 项目元数据保持一致）；上游新增 MC 版本时改这一行
          GAME_VERSIONS: "26.1,26.1.1,26.1.2,26.2,26.3"
        run: |
          python3 - <<'PY'
          import glob, io, json, os, sys, urllib.error, urllib.request, uuid

          try:
              sys.stdout.reconfigure(encoding='utf-8')
          except Exception:
              pass

          API = 'https://api.modrinth.com/v2'
          # 项目 id（base62）。必须用 id 而不是 slug：项目尚未公开时，用 slug 上传版本会 401
          PROJECT = 'VKY1fqvo'
          TOKEN = os.environ['MODRINTH_TOKEN']
          CHECK_ONLY = (os.environ.get('MODRINTH_CHECK_ONLY') or '').strip().lower() == 'true'
          TAG = os.environ['TAG']
          VERSION = TAG.lstrip('v')
          GAME_VERSIONS = [v for v in (os.environ.get('GAME_VERSIONS') or '').split(',') if v]
          LOADERS = ['velocity']


          def call(method, path, data=None, ctype=None):
              req = urllib.request.Request(API + path, data=data, method=method)
              req.add_header('User-Agent', 'MikuMC-Plugin-Dev/1.0')
              req.add_header('Authorization', TOKEN)
              if ctype:
                  req.add_header('Content-Type', ctype)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      raw = r.read().decode('utf-8')
                      return r.status, (json.loads(raw) if raw.strip() else {})
              except urllib.error.HTTPError as e:
                  return e.code, {'error': e.read().decode('utf-8', 'replace')[:400]}


          status, versions = call('GET', '/project/%s/version' % PROJECT)
          if status != 200:
              print('读取项目版本失败:', status, versions)
              sys.exit(1)
          existing = [v['version_number'] for v in versions]
          print('项目 %s 现有版本:' % PROJECT, existing or '(空)')

          if CHECK_ONLY:
              print('[check-only] 只读校验通过：令牌可用、项目可访问、未上传任何内容')
              sys.exit(0)

          if VERSION in existing:
              print('[skip] Modrinth 上已存在 %s，跳过上传（幂等）' % VERSION)
              sys.exit(0)

          # changelog 复用 GitHub Release 正文，避免两处各写一份
          changelog = 'MikuAuth %s（正式版）' % VERSION
          try:
              req = urllib.request.Request(
                  'https://api.github.com/repos/%s/releases/tags/%s' % (os.environ['REPO'], TAG))
              req.add_header('User-Agent', 'MikuMC-Plugin-Dev/1.0')
              req.add_header('Authorization', 'Bearer ' + os.environ['GITHUB_TOKEN'])
              req.add_header('Accept', 'application/vnd.github+json')
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = (json.loads(r.read().decode()) or {}).get('body') or ''
              if body.strip():
                  changelog = body
          except Exception as exc:
              print('取 GitHub Release 正文失败，改用兜底 changelog:', repr(exc))

          jars = [p for p in glob.glob('target/MikuAuth-*.jar')
                  if 'original-' not in os.path.basename(p)]
          if len(jars) != 1:
              print('期望恰好一个 shade 后的 jar，实际:', jars)
              sys.exit(1)
          jar = jars[0]
          with open(jar, 'rb') as f:
              content = f.read()
          filename = os.path.basename(jar)

          data = {
              'project_id': PROJECT,
              'name': 'MikuAuth %s' % VERSION,
              'version_number': VERSION,
              'changelog': changelog,
              'version_type': 'release',
              'game_versions': GAME_VERSIONS,
              'loaders': LOADERS,
              'environment': 'server_only',
              'file_parts': ['file'],
              'primary_file': 'file',
              'status': 'listed',
              'featured': False,
              'dependencies': [],
          }

          boundary = '----MikuMC' + uuid.uuid4().hex
          buf = io.BytesIO()
          buf.write(('--%s\r\n' % boundary).encode())
          buf.write(b'Content-Disposition: form-data; name="data"\r\n\r\n')
          buf.write(json.dumps(data, ensure_ascii=False).encode('utf-8'))
          buf.write(b'\r\n')
          buf.write(('--%s\r\n' % boundary).encode())
          buf.write(('Content-Disposition: form-data; name="file"; filename="%s"\r\n'
                     % filename).encode())
          buf.write(b'Content-Type: application/java-archive\r\n\r\n')
          buf.write(content)
          buf.write(b'\r\n')
          buf.write(('--%s--\r\n' % boundary).encode())

          status, resp = call('POST', '/version', buf.getvalue(),
                              'multipart/form-data; boundary=%s' % boundary)
          if status in (200, 201):
              print('已发布到 Modrinth: %s (%s) id=%s' % (
                  resp.get('version_number'), resp.get('version_type'), resp.get('id')))
          else:
              print('上传失败:', status, resp)
              sys.exit(1)
          PY
