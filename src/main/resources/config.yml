# ============================================================================
#  MikuAuth 配置文件
#  Velocity 登录验证插件：正版多源免密 / 基岩版免密 / Dialog 对话框 / SQLite
#
#  说明：
#   * 所有配置项均有中文注释，修改后可通过 /mikuauth reload 热重载；
#   * 所有游戏内可见文本（聊天 / Title / BossBar / 对话框 / 踢出原因）
#     请在 messages.yml 中自定义；
#   * 升级插件后若新增配置项，缺失的键会自动使用内置默认值，无需重写本文件。
# ============================================================================

# ----------------------------------------------------------------------------
# 服务器与调度
# ----------------------------------------------------------------------------
server:

  # 认证服务器名：玩家进入代理后首先被调度到该服务器完成登录/注册。
  # 必须与 velocity.toml [servers] 段中登记的名称一致。
  # ⚠ 插件强校验：若找不到该认证服，MikuAuth 将直接停用（不加载任何功能）。
  auth-server: "auth"

  # 认证完成后送回的服务器名。
  # 留空 = 自动使用 velocity.toml 中 try 列表的第一个非认证服。
  fallback-server: ""

# ----------------------------------------------------------------------------
# Java 正版验证（多源免密）
#
# 玩家登录时并发查询以下三个验证源，只要其中任意一个确认该昵称存在正版账号，
# 代理就会对该连接强制执行正版会话校验（盗版客户端无法冒充正版昵称），
# 校验通过的玩家免密登录。
#
# 请求超时与缓存可按服务器规模调整；验证源可单独关闭。
# 本段全部支持 /mikuauth reload 热重载（重载会清空正版结果缓存）。
# ----------------------------------------------------------------------------
premium:

  # 正版验证总开关。关闭后所有玩家一律走离线（密码）验证。
  enabled: true

  # Mojang 官方 API（api.mojang.com）—— 权威数据源，建议保持开启。
  mojang: true

  # Ashcon 镜像 API（api.ashcon.app）。
  ashcon: true

  # WPME 镜像 API（api-mc.wpme.pl）。
  wpme: true

  # 正版玩家在 Mojang 改名后，自动把账号数据迁移到新昵称，并释放旧昵称。
  #
  # 为什么需要：账号记录以 UUID 为身份键，玩家改名后 UUID 不变，
  #   插件会用 Mojang UUID 找到旧记录并把它迁到新昵称 —— 密码、注册信息、
  #   登录统计全部保留，旧昵称随之空出来可被其他玩家使用；
  #   同时，若旧昵称的残留记录已被确认不再属于该玩家，也会被自动清理。
  # 关闭后：改名会在新昵称下另立一条记录，旧昵称会被旧记录永久占住（死昵称），
  #   只能由管理员用 /mikuauth unbind 手工处理。
  auto-migrate-renamed: true

  # 单次上游请求超时（毫秒），范围 300 ~ 30000。
  timeout-millis: 5000

  # 正版命中结果的内存缓存时长（分钟）。0 = 不缓存（每次登录都查询上游）。
  hit-ttl-minutes: 60

  # "该昵称不是正版"结果的缓存时长（分钟）。0 = 不缓存。
  miss-ttl-minutes: 10

  # 全部验证源失败（网络故障等）时如何处理未注册的新玩家：
  #   true  = 拒绝进入（安全优先，杜绝正版昵称被离线客户端抢注，推荐）
  #   false = 按离线玩家处理（可用性优先，存在昵称被抢注风险）
  fail-closed: true

# ----------------------------------------------------------------------------
# 基岩版（Floodgate）免密
#
# 通过 Floodgate 接入的基岩版玩家由 Floodgate 自身完成身份验证，
# 本插件识别后直接免密登录，不要求密码、不弹对话框。
# ----------------------------------------------------------------------------
bedrock:

  # 基岩版免密总开关。关闭后基岩版玩家与离线玩家同样需要注册/登录。
  auto-login: true

  # Floodgate 用户名前缀的兜底值。
  # 实际前缀优先从 Floodgate API 读取，此项仅用于 Floodgate 不可用时兜底判断。
  username-prefix: "."

# ----------------------------------------------------------------------------
# 会话（同 IP 免密）
#
# 离线玩家完成登录后，在有效期内从同一 IP 再次进入时免密登录。
# 会话保存在数据库中，重启代理不会丢失。
#
# 调度行为：会话判定在登录握手阶段（PreLogin）完成——会话有效时玩家
#          直接进入正式服务器（与正版/基岩免密玩家一样跳过认证服），
#          不再"先进认证服、判定免密后再被送走"，省去一次跳服与等待。
#
# 为什么不用"设备凭证（Cookie）"：原版客户端的 Cookie 只在内存中、不落盘，
# 仅在一次连接及其 transfer 转移内有效，客户端断开或从服务器列表重连即丢失，
# 因此无法实现"记住这台设备"。离线账号的跨会话免密只有 IP 这一个维度可用。
#
# 安全提示：同 IP 不等于同一人（NAT、网吧、合租）。若对此有顾虑，可把
#          duration-minutes 调小（例如 15），或直接 enabled: false 关闭免密。
# ----------------------------------------------------------------------------
session:

  # 会话免密总开关。关闭后所有离线玩家每次进入都需输入密码。
  enabled: true

  # 会话有效时长（分钟）。"用密码登录/注册成功"总是刷新它；
  # "免密进入是否也刷新"由下面的 renew-on-session-login 决定。
  duration-minutes: 60

  # 免密进入时是否续期（滑动窗口）。
  #
  #   true  —— 玩家在有效期内从同一 IP 进入，会话顺延一个完整时长，
  #            活跃玩家无需反复输密码（推荐：对玩家体验最好）；
  #   false —— 免密进入不刷新，会话从"上次密码登录"起硬性到期，
  #            到期后必须重新输一次密码。
  #
  # 安全提示：开启续期意味着"持续活跃 = 持续免密"。若希望免密有硬性上限，
  #          可把 duration-minutes 调小（例如 30）或设为 false。
  renew-on-session-login: true

# ----------------------------------------------------------------------------
# 审计日志
#
# 记录每次登录的结果与方式（密码 / 正版 / 基岩 / 会话免密）、密码错误、
# 注册、认证超时、被拒绝的连接以及管理员操作，存于数据库表 miku_audit_log。
#
# 用途：排查"这个号是不是被盗了""最近暴破多不多""某人什么时候注册的"。
# 查询命令：/mikuauth audit <玩家>   或   /mikuauth audit ip <IP>
# ----------------------------------------------------------------------------
audit:

  # 总开关。关闭后不写任何记录（查询命令会提示未启用）。
  enabled: true

  # 保留天数。超期记录由定时任务清理；0 = 永久保留（需自行留意表大小）。
  retain-days: 30

  # 查询命令单次返回的最大条数。
  query-limit: 20

  # 昵称冲突记录文件（相对 MikuAuth 数据目录）。
  #
  # 记录"同名连接已在线、本次连接被顶下线"（重复登录冲突）的事件：与控制台日志分离，
  # 不受日志轮转影响，便于你不在线时事后核对谁、何时、从哪个 IP 被顶下线。
  #
  # 注意：玩家使用「已属于正版账号的昵称」却以离线客户端连接时，失败发生在加密握手阶段，
  # 而该阶段 Velocity 不产生任何事件（DisconnectEvent 只在登录事件触发之后才发出），
  # 因此这类失败不会写入本文件——排查请看代理控制台（hasJoined 校验失败）与
  # /mikuauth diagnose <昵称>。
  #
  # 每行格式：时间 | 昵称 | 来源 IP | 断开状态 | 说明
  # 留空则关闭该记录。
  premium-conflict-file: "premium-conflicts.log"

  # 后端拒绝进入记录文件（相对 MikuAuth 数据目录）。
  #
  # 玩家已通过认证、却在进入目标服时被该服（或其上的插件：验证网关、白名单、人数限制等）
  # 直接踢回时，记录该服给出的原因；同一份原因也会转发到玩家聊天栏。
  #
  # 为什么单独落盘：这类拒绝只发生在"去目标服的那条连接"上，玩家此时仍留在认证服里，
  # 代理控制台只有一行 WARN、子服日志也只有一行，事后很难还原"谁被哪个服因为什么拒了"。
  #
  # 不含原因的失败（目标服离线、连接被意外关闭）不写入本文件，由转服调度自动重试。
  #
  # 每行格式：时间 | 玩家 | 目标服 | 原因
  # 留空则关闭该记录。
  backend-kick-file: "backend-kicks.log"

# ----------------------------------------------------------------------------
# 账号迁移（/mikuauth migrate）
#
# 迁移时"位置"参数会让服务器以本机身份连接目标数据库：可读取本机 SQLite 文件，
# 也可向任意主机发起 MySQL/MariaDB 连接。这里可以为该能力设置白名单。
# ----------------------------------------------------------------------------
migrate:

  # 允许的位置前缀（逗号分隔，前缀匹配）。
  #
  # 例：allowed-prefixes: "sqlite:/srv/auth-plugins/,mysql://127.0.0.1:"
  # 留空 = 不限制（默认）。留空时功能开箱可用，但任何拥有 mikuauth.admin
  # 权限的人都能让服务器连接任意库——多人共管时建议填上。
  allowed-prefixes: ""

# ----------------------------------------------------------------------------
# 注册
# ----------------------------------------------------------------------------
registration:

  # 密码最小长度（字符）。
  min-password-length: 6

  # 密码最大长度（字符）。
  max-password-length: 32

  # 每个 IP 最多可注册的账号数量。
  # 统计口径：按"注册 IP 或最近登录 IP"任一匹配计数并去重，
  #           正版账号（正版玩家自动登记）不计入配额。
  # 0 = 不限制。可在运行时用 /mikuauth limit <数量> 临时调整。
  max-accounts-per-ip: 3

# ----------------------------------------------------------------------------
# 登录
# ----------------------------------------------------------------------------
login:

  # 密码最大尝试次数，超过后踢出；0 = 不限次数。
  max-tries: 5

  # 未认证玩家的认证超时（秒），超时踢出；0 = 不超时。
  # 超时进度会同步显示在 BossBar 上。
  timeout-seconds: 60

  # BCrypt 密码哈希成本因子（4~31，默认 10）。
  # 数值每 +1 计算耗时约翻倍：越高越抗暴力破解，注册/登录响应越慢。
  # 建议保持 10；仅在登录并发压力较大时酌情降至 8~9。
  bcrypt-cost: 10

# ----------------------------------------------------------------------------
# Dialog 对话框菜单（原版 1.21.6+）
#
# PacketEvents 为本插件的强依赖：未安装 packetevents-velocity（官方完整版）时
# 插件不会加载。对话框功能恒开，无需开关。
#
# 安全提示：对话框通过命令通道提交密码（/login <密码>），
# 如你修改过 Velocity 日志配置，请勿开启命令内容记录。
# ----------------------------------------------------------------------------
dialog:

  # 延迟发送对话框的毫秒数：与子服的 Join Game 包竞争，发送过早部分客户端会忽略，
  # 700ms 是实测稳定值。
  show-delay-millis: 700

# ----------------------------------------------------------------------------
# 显示（Title / BossBar）
# 文本内容请在 messages.yml 中自定义。
# ----------------------------------------------------------------------------
display:

  # 是否启用 Title 标题提示。
  title: true

  # 是否启用 BossBar 血条提示（显示认证倒计时）。
  bossbar: true

  # BossBar 颜色：PINK / BLUE / RED / GREEN / YELLOW / PURPLE / WHITE
  bossbar-color: "YELLOW"

  # BossBar 样式：PROGRESS（实心） / NOTCHED_6 / NOTCHED_10 / NOTCHED_12 / NOTCHED_20（分段）
  bossbar-overlay: "PROGRESS"

# ----------------------------------------------------------------------------
# 数据库
#
# type = sqlite  ：单文件数据库，零外部依赖，适合单代理实例（默认）
# type = mariadb ：网络数据库，适合多代理实例共享同一套账号库
#                 需要先在 MariaDB 中建库并授权，例如：
#                   CREATE DATABASE mikuauth DEFAULT CHARSET utf8mb4;
#                   CREATE USER 'mikuauth'@'%' IDENTIFIED BY '你的密码';
#                   GRANT ALL ON mikuauth.* TO 'mikuauth'@'%';
#                 表名固定为 miku_*，请使用独立 database。
# ----------------------------------------------------------------------------
database:

  # 数据库类型：sqlite / mariadb
  # ⚠ 切换类型不会自动迁移账号数据：从 sqlite 换到 mariadb 时，已有账号不会出现在新库中，
  #   需要自行导出/导入 miku_players 与 miku_sessions 两张表。
  type: "sqlite"

  # SQLite 数据库文件名（存放在插件数据目录 plugins/MikuAuth 下，type = sqlite 时生效）。
  file: "database.db"

  # MariaDB 连接参数（type = mariadb 时生效）
  mariadb:

    host: "127.0.0.1"
    port: 3306
    database: "mikuauth"
    username: "mikuauth"
    password: ""

    # 连接池大小：同时决定数据库操作的并发线程数，按玩家规模调整（2 ~ 32）。
    pool-size: 6

    # 获取连接的超时（毫秒）：数据库不可达时最多等这么久就报错，避免请求堆积。
    connection-timeout-millis: 5000

    # TLS 模式：disable / trust / verify-ca / verify-full
    # 内网直连用 disable；跨网络访问请改为 verify-full 并配置服务器证书。
    ssl-mode: "disable"

# ----------------------------------------------------------------------------
# 安全风控（跨会话失败计数与临时封禁）
#
# login.max-tries 只限制"单次连接"内的尝试次数，玩家断线重连即清零。
# 本段把失败次数做成跨连接的：同一 IP 与同一账号在窗口期内累计失败达到阈值，
# 即临时拒绝后续尝试（两个维度都计数，任一命中就封禁）。
# 计数保存在内存中，重启代理会清零（攻击者无法重启代理，影响可忽略）。
# 可用 /mikuauth unlock <玩家|IP> 手动解除。
# ----------------------------------------------------------------------------
security:

  # 触发临时封禁的连续失败次数；0 = 关闭该保护。
  max-failures: 5

  # 失败计数窗口（分钟）：窗口内没有新的失败则计数清零。
  failure-window-minutes: 15

  # 触发后的封禁时长（分钟）。封禁到期后计数清零，重新给予完整的尝试次数。
  lockout-minutes: 5

# ----------------------------------------------------------------------------
# 命令别名
# 别名在启动时随主命令一并注册到 Velocity，因此修改后需要重启代理才会生效；
# /mikuauth reload 只会刷新插件内部的命令白名单，不会注册新别名。
# ----------------------------------------------------------------------------
commands:

  # /login 的别名。
  login-aliases: ["l", "log"]

  # /register 的别名。
  register-aliases: ["reg"]

  # /changepassword 的别名。
  changepassword-aliases: ["cp", "changepw"]
