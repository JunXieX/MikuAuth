# ============================================================================
#  MikuAuth 配置文件
#  Velocity 登录验证插件：正版免密 / 基岩版免密 / 对话框登录 / SQLite·MariaDB·MySQL
#
#  快速上手：
#   1. 先确认下方 server.auth-server 与 velocity.toml 里登记的认证服同名；
#   2. 离线服重点看 session（同 IP 免密）与 security（防暴破）两段；
#   3. 改完执行 /mikuauth reload 即可生效（少数项需重启代理，键位旁已标注）。
#
#  两项约定：
#   * 所有游戏内可见文本（聊天 / Title / BossBar / 对话框 / 踢出原因）
#     都在 messages.yml 中修改，本文件只管行为；
#   * 插件升级后新增的配置项会自动补进你的文件（只增不改，写入前留 .bak 备份）。
# ============================================================================

# ----------------------------------------------------------------------------
# 服务器与调度
# ----------------------------------------------------------------------------
server:

  # 认证服务器名 —— 玩家进入代理后先被送到这里完成登录/注册。
  # 必须与 velocity.toml [servers] 中登记的名称完全一致。
  # ⚠ 若找不到该服务器，插件会直接停用（不加载任何功能）并在控制台报错。
  auth-server: "limbo"

  # 认证完成后把玩家送回哪个服务器。
  # 留空 = 自动使用 velocity.toml 中 try 列表的第一个非认证服。
  fallback-server: ""

  # 后端服务器关闭/重启时，玩家会被代理弹回认证服；本项决定插件是否自动把他送回。
  #   true  —— 后端一恢复就自动送回（每 5 秒重试一次），玩家不必手动切服；
  #   false —— 不主动干预，玩家需要自己切回正式服。
  # 支持 /mikuauth reload。
  auto-return-on-fallback: true

  # 自动送回 / 转服重试期间，是否在控制台输出日志。
  #   true  —— 静默（默认）：失败与恢复都不打印，只有排查时才需要看 debug 日志；
  #   false —— 每次失败打一条 WARN，恢复时补一条 INFO（排查转服问题时打开）。
  # 支持 /mikuauth reload。
  silence-retry-failures: true

# ----------------------------------------------------------------------------
# Java 正版验证（免密）
#
# 玩家登录时并发查询下列验证源，任一确认该昵称属于正版账号，就对这条连接
# 强制执行正版会话校验：盗版客户端无法冒充正版昵称，校验通过的玩家免密进入。
# 验证源可单独关闭；超时与缓存按服务器规模调整。
# 本段支持 /mikuauth reload（重载会清空正版结果缓存）。
# ----------------------------------------------------------------------------
premium:

  # 正版验证总开关。关闭后所有玩家一律走离线（密码）验证。
  enabled: true

  # Mojang 官方接口 —— 权威数据源，建议保持开启。
  mojang: true

  # Ashcon 镜像接口。
  ashcon: true

  # WPME 镜像接口。
  wpme: true

  # 正版玩家在 Mojang 改名后，自动把账号数据迁到新昵称，并释放旧昵称。
  #   true  —— 改名后密码、注册信息、登录记录全部保留，旧昵称可被其他玩家使用；
  #   false —— 改名会在新昵称下新开一条记录，旧昵称被旧记录永久占住，
  #            需要管理员用 /mikuauth unbind 手工处理。
  auto-migrate-renamed: true

  # 单次验证请求超时（毫秒），范围 300 ~ 30000。
  timeout-millis: 5000

  # "该昵称是正版"的结果缓存多久（分钟）。0 = 不缓存，每次登录都查询。
  hit-ttl-minutes: 60

  # "该昵称不是正版"的结果缓存多久（分钟）。0 = 不缓存。
  miss-ttl-minutes: 10

  # 所有验证源都查询失败（例如代理无法访问外网）时，未注册的新玩家如何处理：
  #   true  = 拒绝进入（安全优先，杜绝正版昵称被离线客户端抢注，推荐）；
  #   false = 按离线玩家处理（可用性优先，存在昵称被抢注的风险）。
  fail-closed: true

# ----------------------------------------------------------------------------
# 基岩版（Floodgate）免密
#
# 通过 Floodgate 接入的基岩版玩家已由 Floodgate 完成身份验证，
# 本插件识别后直接放行：不要求密码、不弹对话框。
# ----------------------------------------------------------------------------
bedrock:

  # 基岩版免密总开关。关闭后基岩版玩家与离线玩家一样需要注册/登录。
  auto-login: true

# ⚠ 基岩版身份只认 Floodgate 的在线注册表，不接受用户名前缀这类可自报的依据，
#   因此本段没有前缀配置项。Floodgate 不可用时基岩玩家会走离线注册/登录。

# ----------------------------------------------------------------------------
# 同 IP 会话免密
#
# 离线玩家用密码登录成功后，在有效期内从同一 IP 再次进入时免密。
# 会话保存在数据库中，重启代理不会丢失；会话有效时玩家直接进入正式服，
# 不会"先进认证服再被送走"，省去一次跳服等待。
#
# ⚠ 安全提示：同一 IP 不等于同一人（NAT、网吧、合租）。
#   如有顾虑，可把时长调小（例如 15 分钟），或直接关闭本功能。
# ----------------------------------------------------------------------------
session:

  # 总开关。关闭后所有离线玩家每次进入都要输密码。
  enabled: true

  # 会话有效时长（分钟）。密码登录/注册成功总会刷新它。
  duration-minutes: 60

  # 免密进入时是否顺延有效期（滑动窗口）。
  #   true  —— 活跃玩家在有效期内进入就顺延一个完整时长，不必反复输密码（推荐）；
  #   false —— 免密进入不刷新，从"上次密码登录"起硬性到期，到期后需重新输一次密码。
  # ⚠ 开启续期意味着"持续活跃 = 持续免密"。
  renew-on-session-login: true

# ----------------------------------------------------------------------------
# 审计日志
#
# 记录每次登录的结果与方式（密码 / 正版 / 基岩 / 会话免密）、密码错误、注册、
# 认证超时、被拒绝的连接，以及管理员操作，存放在数据库表 miku_audit_log。
# 用途：排查"这个号是不是被盗了""最近暴破多不多""某人什么时候注册的"。
# 查询：/mikuauth audit <玩家>   或   /mikuauth audit ip <IP>
# ----------------------------------------------------------------------------
audit:

  # 总开关。关闭后不写任何记录（查询命令会提示未启用）。
  enabled: true

  # 保留天数，超期记录定时清理；0 = 永久保留（请自行留意表大小）。
  retain-days: 30

  # 查询命令单次最多返回多少条。
  query-limit: 20

  # 重复登录冲突记录文件（相对插件数据目录，留空关闭）。
  # 记录"同名连接已在线、本次连接被顶下线"：与控制台日志分开存放，不受日志轮转影响，
  # 便于事后核对谁在何时从哪个 IP 被顶下线。
  # ⚠ 昵称属于正版账号却用盗版客户端连接时，失败发生在进入代理之前，不会记入本文件，
  #   排查请用 /mikuauth diagnose <昵称>。
  # 每行格式：时间 | 昵称 | 来源 IP | 断开状态 | 说明
  # ⚠ 文件在插件启动时打开，改动本项需重启代理。
  premium-conflict-file: "premium-conflicts.log"

  # 被后端服务器拒绝进入的记录文件（相对插件数据目录，留空关闭）。
  # 玩家已通过认证、却在进入目标服时被该服（或其上的验证网关、白名单、人数限制等）
  # 拒绝时，记录该服给出的原因；同一份原因也会转发到玩家聊天栏。
  # 不含原因的失败（目标服离线等）不记录，由转服调度自动重试。
  # 每行格式：时间 | 玩家 | 目标服 | 原因
  # ⚠ 文件在插件启动时打开，改动本项需重启代理。
  backend-kick-file: "backend-kicks.log"

# ----------------------------------------------------------------------------
# 账号迁移（/mikuauth migrate）
#
# 迁移时插件会以本机身份连接目标数据库（本机 SQLite 文件或远程 MySQL/MariaDB）。
# 多人共管时建议用白名单限制可连接的位置。
# ----------------------------------------------------------------------------
migrate:

  # 允许的位置前缀（逗号分隔，前缀匹配）；留空 = 不限制。
  # 例：allowed-prefixes: "sqlite:/srv/auth-plugins/,mysql://127.0.0.1:"
  # ⚠ 留空意味着任何拥有 mikuauth.admin 权限的人都能让服务器连接任意数据库。
  allowed-prefixes: ""

# ----------------------------------------------------------------------------
# 注册
# ----------------------------------------------------------------------------
registration:

  # 密码最小长度（字符）。
  min-password-length: 4

  # 密码最大长度（字符）。
  max-password-length: 32

  # 每个 IP 最多能注册几个账号；0 = 不限制。
  # 统计会同时看"注册 IP"与"最近登录 IP"（去重计数）；**正版账号不计入配额**
  # （正版账号由玩家首次进入时自动登记，不由玩家发起创建）。
  # 运行时可临时调整：/mikuauth limit <数量>
  max-accounts-per-ip: 5

# ----------------------------------------------------------------------------
# 登录
# ----------------------------------------------------------------------------
login:

  # 单次连接内允许的密码尝试次数，超过后踢出；0 = 不限制。
  max-tries: 5

  # 未认证玩家的认证超时（秒），超时踢出；0 = 不超时。
  # 倒计时会同步显示在 BossBar 上。
  timeout-seconds: 60

  # BCrypt 哈希成本（8 ~ 16，默认 10）。
  # 每 +1 计算耗时约翻倍：越高越难被暴力破解，注册/登录也越慢。
  # 建议保持 10；登录压力大时可酌情降到 8~9。低于 8 强度不足、高于 16 只是白烧 CPU，
  # 超出范围会被自动按边界值处理并在控制台提示。
  bcrypt-cost: 10

# ----------------------------------------------------------------------------
# 对话框登录（原版客户端 1.21.6+）
#
# 客户端满足版本要求、且代理已安装 packetevents-velocity（官方完整版）时，
# 登录/注册会以原版对话框呈现（输入框 + 按钮），玩家不必手打命令；
# 任一条件不满足都会自动降级为聊天栏 + Title + BossBar，功能不受影响。
#
# ⚠ 对话框通过命令提交密码（/login <密码>）：若你改过 Velocity 的日志配置，
#   请不要开启命令内容记录。
# ----------------------------------------------------------------------------
dialog:

  # 是否启用对话框登录。
  #   true  —— 支持的客户端弹对话框，不支持的自动降级聊天栏（推荐）；
  #   false —— 一律使用聊天栏命令。
  # 支持 /mikuauth reload。
  enabled: true

  # 对话框延迟多少毫秒发送：发得太早部分客户端会忽略；
  # 700 是实测稳定值，一般无需改动。
  show-delay-millis: 700

# ----------------------------------------------------------------------------
# 登录提示（Title / BossBar）
# 文本内容在 messages.yml 中修改。
# ----------------------------------------------------------------------------
display:

  # 是否启用 Title 标题提示。
  title: true

  # 是否启用 BossBar 血条提示（显示认证倒计时）。
  bossbar: true

  # BossBar 颜色：PINK / BLUE / RED / GREEN / YELLOW / PURPLE / WHITE
  bossbar-color: "YELLOW"

  # BossBar 样式：PROGRESS（实心）/ NOTCHED_6 / NOTCHED_10 / NOTCHED_12 / NOTCHED_20（分段）
  bossbar-overlay: "PROGRESS"

# ----------------------------------------------------------------------------
# 数据库
#
# type = sqlite  ：单文件，适合单代理实例（默认）
# type = mariadb ：MariaDB，适合多代理共享同一套账号库
# type = mysql   ：MySQL，连接参数默认沿用下方 mariadb 段
#
# 表名固定为 miku_*，请使用独立数据库。改用网络数据库前需要先建库并授权：
#   CREATE DATABASE mikuauth DEFAULT CHARSET utf8mb4;
#   CREATE USER 'mikuauth'@'%' IDENTIFIED BY '你的密码';
#   GRANT ALL ON mikuauth.* TO 'mikuauth'@'%';
#
# 驱动按需获取（三种驱动都不随插件打包）：优先使用服务器已有的驱动，
# 其次读取插件数据目录 libs/ 下的缓存，最后从阿里云镜像自动下载（校验 SHA-256，
# 失败再试 Maven Central）。离线服务器请预先下载驱动 jar 放进 libs/ 目录。
#
# ⚠ 本段在插件启动时建立连接，改动后需重启代理（reload 不会重建连接）。
# ⚠ 切换数据库类型不会搬运已有账号，需要自行导出/导入 miku_players 与 miku_sessions。
# ----------------------------------------------------------------------------
database:

  # 数据库类型：sqlite / mariadb / mysql
  type: "sqlite"

  # SQLite 数据库文件名（位于插件数据目录 plugins/MikuAuth 下）。
  file: "database.db"

  # 网络数据库连接参数（type = mariadb / mysql 时生效）。
  # 若要让 MySQL 单独用一套参数，可自行添加 database.mysql 段：其中出现的同名键
  # （host / port / database / username / password / pool-size /
  #   connection-timeout-millis / ssl-mode）优先于本段，未出现的键回落到本段。
  mariadb:

    host: "127.0.0.1"
    port: 3306
    database: "mikuauth"
    username: "mikuauth"
    password: ""

    # 连接池大小，同时决定数据库操作的并发线程数，按玩家规模调整（2 ~ 32）。
    pool-size: 6

    # 获取连接的超时（毫秒）：数据库不可达时最多等这么久就报错，避免请求堆积。
    connection-timeout-millis: 5000

    # TLS 模式：disable / trust / verify-ca / verify-full
    # 内网直连用 disable；跨网络访问建议 verify-full 并配置服务器证书。
    ssl-mode: "disable"

# ----------------------------------------------------------------------------
# 防暴破（跨会话失败计数）
#
# login.max-tries 只限制单次连接内的尝试次数，玩家断线重连即清零；
# 本段把失败计数做成跨连接的：同一 IP 与同一账号两个维度分别累计，
# 窗口期内达到阈值就临时拒绝后续尝试（任一维度命中即封禁）。
# 计数保存在内存中，重启代理会清零；可用 /mikuauth unlock <玩家|IP> 手动解除。
# ----------------------------------------------------------------------------
security:

  # 触发临时封禁的失败次数；0 = 关闭该保护。
  max-failures: 5

  # 失败计数窗口（分钟）：窗口内没有新的失败则计数清零。
  failure-window-minutes: 15

  # 封禁时长（分钟）。到期后计数清零，重新获得完整的尝试次数。
  lockout-minutes: 5

# ----------------------------------------------------------------------------
# 命令别名
# ⚠ 别名只在插件启动时注册，修改后需重启代理；
#   /mikuauth reload 不会注册新别名。
# ----------------------------------------------------------------------------
commands:

  # /login 的别名。
  login-aliases: ["l", "log"]

  # /register 的别名。
  register-aliases: ["reg"]

  # /changepassword 的别名。
  changepassword-aliases: ["cp", "changepw"]